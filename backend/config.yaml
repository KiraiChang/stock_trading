server:
  port: "8080"                # 環境變數：SERVER_PORT

# ── 資料庫設定 ────────────────────────────────────────────────
# driver: "sqlite"    開發環境，不需安裝任何資料庫，資料存在單一檔案
# driver: "mysql"     生產環境，需要 MySQL 8.0+
# driver: "postgres"  生產環境，需要 PostgreSQL 14+
#
# Migration 由 goose 在啟動時自動執行，不需手動跑 SQL。
database:
  driver: "sqlite"            # 環境變數：DATABASE_DRIVER
  dsn: "../../output/stock_trading/trading.db"  # 環境變數：DATABASE_DSN
  # MySQL DSN 範例（driver 改為 mysql 時使用）：
  # dsn: "root:password@tcp(127.0.0.1:3306)/trading?parseTime=true&loc=Asia%2FTaipei"
  # PostgreSQL DSN 範例（driver 改為 postgres 時使用）：
  # dsn: "postgres://user:password@127.0.0.1:5432/trading?sslmode=disable"

# Redis 為選填；addr 留空則停用快取（開發時不需要）
redis:
  addr: ""        # 環境變數：REDIS_ADDR（留空 = 停用 Redis；生產改為 "127.0.0.1:6379"）
  password: ""    # 環境變數：REDIS_PASSWORD
  db: 0           # 環境變數：REDIS_DB

finmind:
  api_key: "YOUR_FINMIND_API_KEY"             # 環境變數：FINMIND_API_KEY
  base_url: "https://api.finmindtrade.com/api/v4"  # 環境變數：FINMIND_BASE_URL
  rate_limit: 5                               # 環境變數：FINMIND_RATE_LIMIT
  # 盤中分K（TaiwanStockKBar）需要 Sponsor 級以上的 token，帳號等級不足時
  # 預設關閉，避免排程每 5 分鐘都對 FinMind 發出注定失敗的請求；升級帳號後
  # 改成 true 即可恢復盤中分K排程
  intraday_enabled: false                     # 環境變數：FINMIND_INTRADAY_ENABLED

# Fugle（富果）MarketData API，作為盤中即時行情來源，與 FinMind 並行（不取代歷史/日K）
# 免費公開方案額度：WebSocket 1 連線／同時最多訂閱 5 檔，REST 60 次/分鐘（即時行情、歷史行情各自 60/min）
fugle:
  api_key: "YOUR_FUGLE_API_KEY"                                  # 環境變數：FUGLE_API_KEY
  rest_base_url: "https://api.fugle.tw/marketdata/v1.0/stock"    # 環境變數：FUGLE_REST_BASE_URL
  ws_endpoint: "wss://api.fugle.tw/marketdata/v1.0/stock/streaming"  # 環境變數：FUGLE_WS_ENDPOINT
  enabled: false                              # 環境變數：FUGLE_ENABLED，驗證通過前預設關閉
  quote_rate_limit: 60                        # 環境變數：FUGLE_QUOTE_RATE_LIMIT
  max_subscriptions: 5                        # 環境變數：FUGLE_MAX_SUBSCRIPTIONS
  reconnect_max_sec: 60                       # 環境變數：FUGLE_RECONNECT_MAX_SEC

# ── 認證設定 ──────────────────────────────────────────────────
# 生產環境請務必更換為隨機長字串，例如：
#   openssl rand -hex 32
auth:
  jwt_secret: "change-me-in-production"  # 環境變數：AUTH_JWT_SECRET

# Python 回測服務設定
# service_url: 留空 = 僅用 Method A（worker 輪詢 DB）
#              填入 = Method A + Method B（同時推送 HTTP 通知）
python:
  service_url: ""   # 環境變數：PYTHON_SERVICE_URL（e.g. "http://localhost:8001"）

# 籌碼資料同步設定（三大法人、融資融券、券商分點、chip_scores）
chip:
  sync:
    history_trading_days: 500   # 環境變數：CHIP_SYNC_HISTORY_TRADING_DAYS，backfill 預設回補天數
    batch_size: 50               # 環境變數：CHIP_SYNC_BATCH_SIZE，DB 批次寫入大小

position_analysis:
  max_position_value: 200000
  max_risk_amount: 10000
  add_on_ratio: 0.25
  min_risk_reward_ratio: 1.5
  breakout_target_risk_reward_ratio: 2.0
  take_profit_reduction_ratio: 0.5
  sr_reuse_max_age_hours: 24
