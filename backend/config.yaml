server:
  port: "8080"                # 環境變數：SERVER_PORT

# ── 資料庫設定 ────────────────────────────────────────────────
# driver: "sqlite"    開發環境，不需安裝任何資料庫，資料存在單一檔案
# driver: "mysql"     生產環境，需要 MySQL 8.0+
# driver: "postgres"  生產環境，需要 PostgreSQL 14+
#
# Migration 由 goose 在啟動時自動執行，不需手動跑 SQL。
database:
  driver: "sqlite"            # 環境變數：DATABASE_DRIVER
  dsn: "../../output/stock_trading/trading.db"  # 環境變數：DATABASE_DSN
  # MySQL DSN 範例（driver 改為 mysql 時使用）：
  # dsn: "root:password@tcp(127.0.0.1:3306)/trading?parseTime=true&loc=Asia%2FTaipei"
  # PostgreSQL DSN 範例（driver 改為 postgres 時使用）：
  # dsn: "postgres://user:password@127.0.0.1:5432/trading?sslmode=disable"

# Redis 為選填；addr 留空則停用快取（開發時不需要）
redis:
  addr: ""        # 環境變數：REDIS_ADDR（留空 = 停用 Redis；生產改為 "127.0.0.1:6379"）
  password: ""    # 環境變數：REDIS_PASSWORD
  db: 0           # 環境變數：REDIS_DB

finmind:
  api_key: "YOUR_FINMIND_API_KEY"             # 環境變數：FINMIND_API_KEY
  base_url: "https://api.finmindtrade.com/api/v4"  # 環境變數：FINMIND_BASE_URL
  rate_limit: 5                               # 環境變數：FINMIND_RATE_LIMIT
  # 盤中分K（TaiwanStockKBar）需要 Sponsor 級以上的 token，帳號等級不足時
  # 預設關閉，避免排程每 5 分鐘都對 FinMind 發出注定失敗的請求；升級帳號後
  # 改成 true 即可恢復盤中分K排程
  intraday_enabled: false                     # 環境變數：FINMIND_INTRADAY_ENABLED

# Fugle（富果）MarketData API，作為盤中即時行情來源，與 FinMind 並行（不取代歷史/日K）
# 免費公開方案額度：WebSocket 1 連線／同時最多訂閱 5 檔，REST 60 次/分鐘（即時行情、歷史行情各自 60/min）
fugle:
  api_key: "YOUR_FUGLE_API_KEY"                                  # 環境變數：FUGLE_API_KEY
  rest_base_url: "https://api.fugle.tw/marketdata/v1.0/stock"    # 環境變數：FUGLE_REST_BASE_URL
  ws_endpoint: "wss://api.fugle.tw/marketdata/v1.0/stock/streaming"  # 環境變數：FUGLE_WS_ENDPOINT
  enabled: false                              # 環境變數：FUGLE_ENABLED，驗證通過前預設關閉
  quote_rate_limit: 60                        # 環境變數：FUGLE_QUOTE_RATE_LIMIT
  max_subscriptions: 5                        # 環境變數：FUGLE_MAX_SUBSCRIPTIONS
  reconnect_max_sec: 60                       # 環境變數：FUGLE_RECONNECT_MAX_SEC
  max_conn_cooldown_sec: 60                   # 環境變數：FUGLE_MAX_CONN_COOLDOWN_SEC，maxconn 遞增冷卻起始值
  ping_interval_sec: 30                       # 環境變數：FUGLE_PING_INTERVAL_SEC，主動 ping 保活間隔（負值關閉）

# Yahoo 股市盤中資料源（非官方 API），作為 Tier-1 批次盤中源，與 Fugle 並存/擇一。
# 免 token、單次請求可批次多檔；enabled=true 時 scheduler 盤中 job 會優先走 Yahoo。
# 上線前請以 cmd/yahoo-check 於盤中時段驗證覆蓋率與延遲（見 docs/yahoo-intraday-integration.md）。
#
# **這段設定不是只有盤中在用**：Yahoo 在本系統有兩個客戶端，打的是兩個不同端點——
#   1. 盤中報價（FinanceChartService.ApacLibraCharts）：受 enabled 控制，用 base_url。
#   2. 除權息逐檔查詢（StockServices.dividendsByYear）：由 corporate_action_sync 使用，
#      **無條件建立**（cmd/server/main.go），端點寫死在 yahoo_dividend.go，不讀 base_url。
# 兩者**共用同一個節流器**（同一個 host，各自節流會讓實際速率加倍），而那個節流器的速率
# 就是下面的 rate_limit。所以 enabled=false 不代表這段設定沒在用。
yahoo:
  base_url: "https://tw.stock.yahoo.com/_td-stock/api/resource/FinanceChartService.ApacLibraCharts"  # 環境變數：YAHOO_BASE_URL
                                              # **只作用於盤中報價端點**；除權息端點不受它影響。
  enabled: false                              # 環境變數：YAHOO_ENABLED，驗證通過前預設關閉
                                              # **只控制盤中客戶端**；除權息同步照跑。
  rate_limit: 20                              # 環境變數：YAHOO_RATE_LIMIT，每分鐘請求上限（批次計為一次）
                                              # **同時節流除權息逐檔同步，與 enabled 無關。**
                                              # 這個值進了 corporate_action_sync 的預算算術：
                                              # 逐檔要打 Yahoo（除權息）＋ FinMind（減資），節奏由慢的一邊決定。
                                              # 目前 finmind.rate_limit=5 主導（每檔約 12 秒）；
                                              # **把這裡調到 5 以下會換成 Yahoo 主導**，
                                              # corporate_action.timeout_sec 的 45 分鐘預算就會失準。
                                              # 分片與預算見 docs/architecture.md「公司行動同步是唯一
                                              # 『watchlist 優先、其餘輪替』的排程」。
  batch_size: 40                              # 環境變數：YAHOO_BATCH_SIZE，單次請求最多帶入的 symbol 數
                                              # 只作用於盤中批次；除權息只能逐檔（symbol 編在 URL path 裡）。

# TWSE ISIN 股票主檔同步。每日抓上市＋上櫃有價證券清單並維護 stock_symbols.is_listed，
# 供 watchlist 判斷原本加入的標的是否仍在交易所名單內。任一來源抓取失敗即整體略過本次
# 同步（不做部分下市）。
stock_symbols:
  enabled: true                               # 環境變數：STOCK_SYMBOLS_ENABLED
  sync_urls:                                  # 需同時涵蓋上市與上櫃，否則另一半市場會被誤判為下市
    - "https://isin.twse.com.tw/isin/C_public.jsp?strMode=2"   # 上市
    - "https://isin.twse.com.tw/isin/C_public.jsp?strMode=4"   # 上櫃
  cron: "30 6 * * *"                         # 環境變數：STOCK_SYMBOLS_CRON，台北時區每日 06:30
  # 以下兩項留 0 代表沿用程式預設（timeout 300 秒、來源間隔 3 秒），預設值定義在
  # internal/market/twse_isin.go；只有要覆寫時才填非 0 的值。
  timeout_sec: 0                             # 環境變數：STOCK_SYMBOLS_TIMEOUT_SEC，單一 TWSE ISIN 請求（含讀 body）上限
  fetch_delay_sec: 0                         # 環境變數：STOCK_SYMBOLS_FETCH_DELAY_SEC，上市→上櫃兩次請求之間的間隔

# ── 認證設定 ──────────────────────────────────────────────────
# 生產環境請務必更換為隨機長字串，例如：
#   openssl rand -hex 32
auth:
  jwt_secret: "change-me-in-production"  # 環境變數：AUTH_JWT_SECRET

# Python 回測服務設定
# service_url: 留空 = 僅用 Method A（worker 輪詢 DB）
#              填入 = Method A + Method B（同時推送 HTTP 通知）
python:
  service_url: ""   # 環境變數：PYTHON_SERVICE_URL（e.g. "http://localhost:8001"）
  sr_zones_timeout_sec: 120  # 環境變數：PYTHON_SR_ZONES_TIMEOUT_SEC；SR Zone 同步分析含 evidence/SHAP，需比一般分析長

# 籌碼資料同步設定（三大法人、融資融券、券商分點、chip_scores）
chip:
  sync:
    history_trading_days: 500   # 環境變數：CHIP_SYNC_HISTORY_TRADING_DAYS，backfill 預設回補天數
    batch_size: 50               # 環境變數：CHIP_SYNC_BATCH_SIZE，DB 批次寫入大小
    cron: "0 21 * * 1-5"        # 環境變數：CHIP_SYNC_CRON，日結籌碼採集排程（台北時區）。
                                 # 與 15:00 收盤掃描解耦：FinMind 法人傍晚、融資融券晚間才發布，
                                 # 太早抓會是空資料造成落後一天。需自動重試可設多時段如 "0 18,20,22 * * 1-5"。

# 定期對 watchlist 產生 SR zone 分析（todo.md T-052）。這是 production 驗證母體的來源：
# 沒有它，stock_sr_zone_analyses 只會累積人工點擊的零星幾筆，I-074 / T-049 的分佈比較
# 永遠做不了。走的是與使用者手動分析**同一條**帶身分追蹤的路徑（會寫 zone_uid）。
#
# 兩個 cron 是刻意的：SR 分析吃籌碼（trading_score 的 Chip 佔 15%），而籌碼要晚間才發布。
#   cron      17:00 → 當日 K 棒 ＋ 前一日籌碼（收盤後盡快有一份）
#   chip_cron 22:00 → 當日 K 棒 ＋ 當日籌碼（晚於 chip sync 21:00、早於 sr_evaluation 22:30）
# 兩輪都會跳過「最新 K 棒不是今天」的標的；chip_cron 那輪額外跳過「籌碼不是今天」的標的。
sr_analysis:
  enabled: false                 # 環境變數：SR_ANALYSIS_ENABLED
  cron: "0 17 * * 1-5"           # 環境變數：SR_ANALYSIS_CRON，台北時區
  chip_cron: "0 22 * * 1-5"      # 環境變數：SR_ANALYSIS_CHIP_CRON，台北時區
  timeframe: "1d"                # 環境變數：SR_ANALYSIS_TIMEFRAME
  limit: 400                     # 環境變數：SR_ANALYSIS_LIMIT，抓取的歷史 K 棒根數

# SR Zone evaluation / decision replay 自動驗證。預設關閉，避免開發環境啟動後自動跑大量
# Python replay；開啟後若 symbols 留空，會使用 watchlist 全部股票。
sr_evaluation:
  enabled: false                 # 環境變數：SR_EVALUATION_ENABLED
  cron: "30 22 * * 1-5"          # 環境變數：SR_EVALUATION_CRON，台北時區，預設晚於 chip sync
  symbols: []                    # 環境變數：SR_EVALUATION_SYMBOLS，空陣列 = watchlist
  timeframe: "1d"                # 環境變數：SR_EVALUATION_TIMEFRAME
  limit: 1500                    # 環境變數：SR_EVALUATION_LIMIT
  decision_replay: true          # 環境變數：SR_EVALUATION_DECISION_REPLAY
  replay_max_rows: 200           # 環境變數：SR_EVALUATION_REPLAY_MAX_ROWS
  write_db: true                 # 環境變數：SR_EVALUATION_WRITE_DB，寫入 stock_sr_regression_results

# 評估標的池的每日日 K 維護（T-040 Step 5）。**預設關閉**：一次會對整個池（實測 131 檔）
# 各發一個 FinMind 請求，5 req/min 下約 26 分鐘。這個池只維護日 K，不進盤中掃描、
# 籌碼同步、signal 或 production SR 分析——那是「新標的不能放進 watchlists」的核心約束。
evaluation_universe:
  enabled: false                 # 環境變數：EVALUATION_UNIVERSE_ENABLED
  cron: "0 16 * * 1-5"           # 環境變數：EVALUATION_UNIVERSE_CRON，台北時區。
                                 # 選 16:00：晚於 daily_close（15:00 已確認 FinMind 當日日K已發布，
                                 # 14:00 曾抓到 count=0），且與 21:00 籌碼採集有近 5 小時緩衝。
  days: 10                       # 環境變數：EVALUATION_UNIVERSE_DAYS，往前幾個日曆天。
                                 # 10 而非 5 是為了容忍連假；成本與天數無關（1 request/檔）。

# 公司行動同步（分割／除權息／減資 → 還原係數）。**沒有 enabled 開關**：
# 是否啟用由程式有沒有注入 adjuster 決定。漏跑一次會讓該檔整段歷史出現假跳空，
# 而重算是冪等的，所以沒有關掉它的情境。
corporate_action:
  cron: "30 6 * * 1-5"           # 環境變數：CORPORATE_ACTION_CRON，台北時區。
                                 # 06:30 早於 08:50 的 pre_market，讓開盤前的分析已吃到最新係數。
                                 # 打錯字時會退回預設值繼續跑並記 Error log——這支沒有 enabled
                                 # 開關，靜默停掉等於還原係數無聲過期。
                                 # **不要設得比 80 小時稀疏**（例如每週一）：/scheduler/status
                                 # 的 stale 門檻寫死 80 小時，會永遠顯示逾期。見 api-reference.md
                                 # 「`stale` 門檻寫死在程式裡，不隨 cron 調整」。
                                 # **多時段（例如 "30 6,12 * * 1-5"）對覆蓋率沒有幫助**：
                                 # 逐檔清單依日期分片，同一天的第二輪跑的是同一片。
                                 # 要臨時全量補跑請把 shard_count 設成 1。
  timeout_sec: 2700              # 環境變數：CORPORATE_ACTION_TIMEOUT_SEC。整輪預算，預設 45 分鐘。
                                 # 預算怎麼算的：逐檔同步要打 Yahoo（除權息）與 FinMind（減資），
                                 # 節奏由較慢的 FinMind 5 req/min 決定 → **每檔約 12 秒**。
                                 # 當日名單 ≈ watchlist 11 檔 ＋ 每片約 170 檔 = 181 檔，
                                 # 181 × 12 秒 ≈ 36 分鐘，45 分鐘留了餘裕，且 06:30 起跑會在
                                 # 08:50 的 pre_market 之前結束。
                                 # 逾時不再空轉：剩下的檔會被跳過並計進 job_runs 的
                                 # symbols_failed，狀態記成 partial（見 api-reference.md）。
  shard_count: 5                 # 環境變數：CORPORATE_ACTION_SHARD_COUNT。
                                 # 非 watchlist 標的的分片數；watchlist **不分片，每輪全量**。
                                 # 5 = 週一到週五各一片，每檔每週至少覆蓋一次（預設）。
                                 # 10 = 兩週一輪，單輪時間砍半——job_runs 長期顯示 partial
                                 # （代表某片跑不完）時調這個。
                                 # 1 = 每天全量，除權息旺季臨時補跑用。
                                 # **設 5 的倍數或 1**：片號由「週序號×5 ＋ 平日序號」推導，
                                 # 非 5 的倍數會讓覆蓋週期落在非整數週、不好推理。
                                 # 為什麼不是調高 finmind.rate_limit：全 repo 共用同一個
                                 # FinMind client，調高會連帶放大籌碼同步的請求速率，
                                 # 而 5/min 是綁帳號的保守值、額度未知。

position_analysis:
  max_position_value: 200000
  max_risk_amount: 10000
  add_on_ratio: 0.25
  min_risk_reward_ratio: 1.5
  breakout_target_risk_reward_ratio: 2.0
  take_profit_reduction_ratio: 0.5
  sr_reuse_max_age_hours: 24
