name: stock_trading_dev

x-dev-resource-limits: &dev-resource-limits
  cpus: "0.5"
  mem_limit: 512m
  memswap_limit: 768m
  pids_limit: 200

services:
  postgres:
    <<: *dev-resource-limits
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      - "15432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev_trading_net

  redis:
    <<: *dev-resource-limits
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev_trading_net

  backend:
    <<: *dev-resource-limits
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-server:
        condition: service_started
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: postgres://trading:trading@postgres:5432/trading?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      SERVER_PORT: "8080"
      PYTHON_SERVICE_URL: http://python-server:8001
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-change-me}
      FINMIND_API_KEY: ${FINMIND_API_KEY:-YOUR_FINMIND_API_KEY}
      FINMIND_INTRADAY_ENABLED: ${FINMIND_INTRADAY_ENABLED:-false}
      FUGLE_ENABLED: ${FUGLE_ENABLED:-false}
      FUGLE_API_KEY: ${FUGLE_API_KEY:-YOUR_FUGLE_API_KEY}
      # 評估標的池的每日日 K 維護（T-040 Step 5）。**預設關閉**：一次會對整個池
      # （實測 131 檔）各發一個 FinMind 請求，5 req/min 下約 27 分鐘。
      # 16:00 晚於 daily_close（15:00，已確認當日日 K 已發布），且與 21:00 籌碼採集
      # 有近 5 小時緩衝。這個池只維護日 K，不進盤中掃描、籌碼同步、signal 或 SR 分析。
      EVALUATION_UNIVERSE_ENABLED: ${EVALUATION_UNIVERSE_ENABLED:-false}
      EVALUATION_UNIVERSE_CRON: ${EVALUATION_UNIVERSE_CRON:-0 16 * * 1-5}
      EVALUATION_UNIVERSE_DAYS: ${EVALUATION_UNIVERSE_DAYS:-10}
      LOG_DIR: /app/logs/backend
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    ports:
      - "18080:8080"
    volumes:
      - ./logs/dev/backend:/app/logs/backend
    networks:
      - dev_trading_net

  python-server:
    <<: *dev-resource-limits
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "http_server.py"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: "postgresql+psycopg2://trading:trading@postgres:5432/trading"
      PYTHON_SERVICE_PORT: "8001"
      SR_SCORING_MODEL_PATH: /app/models/sr_scoring_v4.joblib
      LOG_DIR: /app/logs/python-server
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    ports:
      - "18001:8001"
    volumes:
      - ${SR_SCORING_MODELS_DIR:-./python/models}:/app/models
      - ./logs/dev/python-server:/app/logs/python-server
    networks:
      - dev_trading_net

  python-worker:
    <<: *dev-resource-limits
    profiles: ["worker"]
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: "postgresql+psycopg2://trading:trading@postgres:5432/trading"
      SR_SCORING_MODEL_PATH: /app/models/sr_scoring_v4.joblib
      LOG_DIR: /app/logs/python-worker
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    volumes:
      - ${SR_SCORING_MODELS_DIR:-./python/models}:/app/models
      - ./logs/dev/python-worker:/app/logs/python-worker
    networks:
      - dev_trading_net

networks:
  dev_trading_net:
    name: stock_trading_dev_net

volumes:
  dev_postgres_data:
    name: stock_trading_dev_postgres_data
  dev_redis_data:
    name: stock_trading_dev_redis_data
