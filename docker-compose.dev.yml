name: stock_trading_dev

x-dev-resource-limits: &dev-resource-limits
  cpus: "0.5"
  mem_limit: 512m
  memswap_limit: 768m
  pids_limit: 200

services:
  postgres:
    <<: *dev-resource-limits
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading
    ports:
      - "15432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev_trading_net

  redis:
    <<: *dev-resource-limits
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dev_trading_net

  backend:
    <<: *dev-resource-limits
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-server:
        condition: service_started
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: postgres://trading:trading@postgres:5432/trading?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      SERVER_PORT: "8080"
      PYTHON_SERVICE_URL: http://python-server:8001
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-change-me}
      FINMIND_API_KEY: ${FINMIND_API_KEY:-YOUR_FINMIND_API_KEY}
      FINMIND_INTRADAY_ENABLED: ${FINMIND_INTRADAY_ENABLED:-false}
      FUGLE_ENABLED: ${FUGLE_ENABLED:-false}
      FUGLE_API_KEY: ${FUGLE_API_KEY:-YOUR_FUGLE_API_KEY}
      # 評估標的池的每日日 K 維護（T-040 Step 5）。**預設關閉**：一次會對整個池
      # （實測 131 檔）各發一個 FinMind 請求，5 req/min 下約 27 分鐘。
      # 16:00 晚於 daily_close（15:00，已確認當日日 K 已發布），且與 21:00 籌碼採集
      # 有近 5 小時緩衝。這個池只維護日 K，不進盤中掃描、籌碼同步、signal 或 SR 分析。
      EVALUATION_UNIVERSE_ENABLED: ${EVALUATION_UNIVERSE_ENABLED:-false}
      EVALUATION_UNIVERSE_CRON: ${EVALUATION_UNIVERSE_CRON:-0 16 * * 1-5}
      EVALUATION_UNIVERSE_DAYS: ${EVALUATION_UNIVERSE_DAYS:-10}
      # 定期對 watchlist 產生 SR zone 分析（T-052）。**預設關閉**：它是 production
      # 驗證母體的唯一來源（I-074 / T-049），開了就會每天累積分析。
      # 兩個 cron 是刻意的：17:00 那輪拿不到當日籌碼（FinMind 晚間才發布），
      # 22:00 那輪晚於 chip sync（21:00）、早於 sr_evaluation（22:30）。
      SR_ANALYSIS_ENABLED: ${SR_ANALYSIS_ENABLED:-false}
      SR_ANALYSIS_CRON: ${SR_ANALYSIS_CRON:-0 17 * * 1-5}
      SR_ANALYSIS_CHIP_CRON: ${SR_ANALYSIS_CHIP_CRON:-0 22 * * 1-5}
      SR_ANALYSIS_TIMEFRAME: ${SR_ANALYSIS_TIMEFRAME:-1d}
      SR_ANALYSIS_LIMIT: ${SR_ANALYSIS_LIMIT:-400}
      # 公司行動同步（分割／除權息／減資 → 還原係數）。**沒有 enabled 開關**：
      # 漏跑一次就會讓該檔整段歷史出現假跳空，而重算是冪等的，所以沒有關掉它的情境。
      # 打錯字會退回預設值繼續跑並記 Error log。**不要設得比 80 小時稀疏**——
      # /scheduler/status 的 stale 門檻寫死 80 小時（見 docs/api-reference.md）。
      CORPORATE_ACTION_CRON: ${CORPORATE_ACTION_CRON:-30 6 * * 1-5}
      # 留白（預設）時 main.go 會把 gin 設成 release。要看啟動時的路由表就設 debug：
      #   GIN_MODE=debug scripts/smoke-dev.sh
      # debug 模式會多印 76 行 [GIN-debug]，且 panic 時 recovery 會連整包 request header
      # 一起寫進 log（gin 只遮 Authorization），所以只在需要時暫時開。
      GIN_MODE: ${GIN_MODE:-}
      LOG_DIR: /app/logs/backend
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    ports:
      - "18080:8080"
    volumes:
      - ./logs/dev/backend:/app/logs/backend
    networks:
      - dev_trading_net

  python-server:
    <<: *dev-resource-limits
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "http_server.py"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: "postgresql+psycopg2://trading:trading@postgres:5432/trading"
      PYTHON_SERVICE_PORT: "8001"
      SR_SCORING_MODEL_PATH: /app/models/sr_scoring_v4.joblib
      LOG_DIR: /app/logs/python-server
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    ports:
      - "18001:8001"
    volumes:
      - ${SR_SCORING_MODELS_DIR:-./python/models}:/app/models
      - ./logs/dev/python-server:/app/logs/python-server
    networks:
      - dev_trading_net

  python-worker:
    <<: *dev-resource-limits
    profiles: ["worker"]
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: "postgresql+psycopg2://trading:trading@postgres:5432/trading"
      SR_SCORING_MODEL_PATH: /app/models/sr_scoring_v4.joblib
      LOG_DIR: /app/logs/python-worker
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    volumes:
      - ${SR_SCORING_MODELS_DIR:-./python/models}:/app/models
      - ./logs/dev/python-worker:/app/logs/python-worker
    networks:
      - dev_trading_net

networks:
  dev_trading_net:
    name: stock_trading_dev_net

volumes:
  dev_postgres_data:
    name: stock_trading_dev_postgres_data
  dev_redis_data:
    name: stock_trading_dev_redis_data
