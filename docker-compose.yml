services:

  # ── Go Backend ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: postgres://trading:trading@postgres:5432/trading?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      SERVER_PORT: "8080"
      PYTHON_SERVICE_URL: http://python-server:8001
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      FINMIND_API_KEY: ${FINMIND_API_KEY}
    networks:
      - trading-net
      - proxy_net

  # ── Python Worker（Method A：DB polling）─────────────────────
  python-worker:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: "postgresql+psycopg2://trading:trading@postgres:5432/trading"
    networks:
      - trading-net

  # ── Python HTTP Server（Method B：FastAPI）────────────────────
  python-server:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "http_server:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: "postgresql+psycopg2://trading:trading@postgres:5432/trading"
      PYTHON_SERVICE_PORT: "8001"
    networks:
      - trading-net

networks:
  trading-net:
    external: true
  proxy_net:
    external: true