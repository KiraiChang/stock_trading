services:

  # ── Go Backend ────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: postgres://trading:trading@postgres:5432/trading?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      SERVER_PORT: "8080"
      PYTHON_SERVICE_URL: http://python-server:8001
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      FINMIND_API_KEY: ${FINMIND_API_KEY}
      FINMIND_INTRADAY_ENABLED: ${FINMIND_INTRADAY_ENABLED:-false}
      FUGLE_ENABLED: ${FUGLE_ENABLED:-false}
      FUGLE_API_KEY: ${FUGLE_API_KEY}
      YAHOO_ENABLED: ${YAHOO_ENABLED:-false}
      YAHOO_RATE_LIMIT: ${YAHOO_RATE_LIMIT:-20}
      YAHOO_BATCH_SIZE: ${YAHOO_BATCH_SIZE:-40}
      LOG_DIR: /app/logs/backend
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    volumes:
      - ./logs/backend:/app/logs/backend
    networks:
      - trading-net
      - proxy_net

  # ── Python Worker（Method A：DB polling）─────────────────────
  python-worker:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: "postgresql+psycopg2://trading:trading@postgres:5432/trading"
      SR_SCORING_MODEL_PATH: /app/models/sr_scoring_v4.joblib
      LOG_DIR: /app/logs/python-worker
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    volumes:
      - ${SR_SCORING_MODELS_DIR:-./python/models}:/app/models
      - ./logs/python-worker:/app/logs/python-worker
    networks:
      - trading-net

  # ── Python HTTP Server（Method B：FastAPI）────────────────────
  # 僅供 backend 透過 trading-net 內部呼叫（PYTHON_SERVICE_URL），不對外開 port
  python-server:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["uvicorn", "http_server:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: "postgresql+psycopg2://trading:trading@postgres:5432/trading"
      PYTHON_SERVICE_PORT: "8001"
      SR_SCORING_MODEL_PATH: /app/models/sr_scoring_v4.joblib
      LOG_DIR: /app/logs/python-server
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    volumes:
      - ${SR_SCORING_MODELS_DIR:-./python/models}:/app/models
      - ./logs/python-server:/app/logs/python-server
    networks:
      - trading-net

networks:
  trading-net:
    external: true
  proxy_net:
    external: true
