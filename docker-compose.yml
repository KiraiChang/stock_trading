services:

  # ── Go Backend ────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # 設定的來源（I-132；規格見 docs/development-workflow.md「live 的設定：env_file」）：
    #   * 應用設定（機密、開關、cron、各功能的參數）在 scripts 目錄的 .env，由下面的 env_file 注入；
    #     範本是 repo 的 .env.example。⛔ 不再經過 deploy.sh 的 export 與 ${} 展開。
    #   * REDIS_PASSWORD 只存在 Redis stack 的 .env（docker-compose.redis.yml），也由 env_file 直接讀，
    #     值只有一份。
    #   * environment: 只留固定的服務連線設定。⛔ 不能寫 .env.example 裡有的鍵，也⛔ 不能寫 REDIS_PASSWORD：
    #     environment 的優先順序比 env_file 高，寫了就會蓋掉（就算展開成空字串也一樣）。
    #     scripts/test-deploy-sh.sh 會擋重複的鍵。
    # compose 檔裡⛔ 沒有必填的 ${…:?}，手動執行 docker compose ps／logs 不必先帶入任何變數。
    # DATABASE_AUTO_MIGRATE ⛔ 不設（預設 false，T-087）：backend 啟動時只做唯讀檢查，migration 由 deploy.sh 在停機中套用；
    # production 設 true 違反設定契約。
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: postgres://trading:trading@postgres:5432/trading?sslmode=disable
      REDIS_ADDR: redis:6379
      SERVER_PORT: "8080"
      PYTHON_SERVICE_URL: http://python-server:8001
      # 留白（預設）時 main.go 會把 gin 設成 release。**正式環境不要設 debug**：
      # 它會把完整路由表寫進 log，且 panic 時 recovery 會連整包 request header 一起印
      # （gin 只遮 Authorization，Cookie 與自訂 header 照樣落地）。
      # 這裡留這個鍵只是讓排查問題時不必改 compose；.env.example 刻意⛔ 不放它。
      GIN_MODE: ${GIN_MODE:-}
      LOG_DIR: /app/logs/backend
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    env_file:
      # ⛔ 一定要用絕對路徑：相對路徑是相對於 project directory（deploy.sh 用的是 build 目錄）解析，
      # ⛔ 不是相對於這份 compose 檔所在的目錄。複製到 scripts 目錄（命名為 compose.yml）時，
      # 把 /path/to/… 改成實際路徑，而且要跟 deploy.sh 的 APP_ENV_FILE、REDIS_ENV_FILE 相同
      # （deploy.sh 的 preflight 會比對）。忘了改的話，required: true 會讓 compose 直接報錯。
      # ⛔ 不加 format: raw：用 compose 預設的 dotenv 解析（寫法見 .env.example 的開頭）。
      - path: /path/to/scripts/stock_trading/.env   # 應用設定（從 .env.example 複製，權限 600）
        required: true
      - path: /path/to/redis-stack/.env             # 只有一行 REDIS_PASSWORD
        required: true
    volumes:
      - ./logs/backend:/app/logs/backend
    networks:
      - trading-net
      - proxy_net

  # ── Python Worker（Method A：DB polling）─────────────────────
  python-worker:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: "postgresql+psycopg2://trading:trading@postgres:5432/trading"
      SR_SCORING_MODEL_PATH: /app/models/sr_scoring_v4.joblib
      LOG_DIR: /app/logs/python-worker
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    volumes:
      - ${SR_SCORING_MODELS_DIR:-./python/models}:/app/models
      - ./logs/python-worker:/app/logs/python-worker
    networks:
      - trading-net

  # ── Python HTTP Server（Method B：FastAPI）────────────────────
  # 僅供 backend 透過 trading-net 內部呼叫（PYTHON_SERVICE_URL），不對外開 port
  python-server:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "http_server.py"]
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: "postgresql+psycopg2://trading:trading@postgres:5432/trading"
      PYTHON_SERVICE_PORT: "8001"
      SR_SCORING_MODEL_PATH: /app/models/sr_scoring_v4.joblib
      LOG_DIR: /app/logs/python-server
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    volumes:
      - ${SR_SCORING_MODELS_DIR:-./python/models}:/app/models
      - ./logs/python-server:/app/logs/python-server
    networks:
      - trading-net

networks:
  trading-net:
    external: true
  proxy_net:
    external: true
