services:

  # ── Go Backend ────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: postgres://trading:trading@postgres:5432/trading?sslmode=disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      SERVER_PORT: "8080"
      PYTHON_SERVICE_URL: http://python-server:8001
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      FINMIND_API_KEY: ${FINMIND_API_KEY}
      FINMIND_INTRADAY_ENABLED: ${FINMIND_INTRADAY_ENABLED:-false}
      FUGLE_ENABLED: ${FUGLE_ENABLED:-false}
      FUGLE_API_KEY: ${FUGLE_API_KEY}
      YAHOO_ENABLED: ${YAHOO_ENABLED:-false}
      YAHOO_RATE_LIMIT: ${YAHOO_RATE_LIMIT:-20}
      YAHOO_BATCH_SIZE: ${YAHOO_BATCH_SIZE:-40}
      # 評估標的池的每日日 K 維護（T-040 Step 5）。**預設關閉**：一次會對整個池
      # （實測 131 檔）各發一個 FinMind 請求，5 req/min 下約 27 分鐘。
      # 16:00 晚於 daily_close（15:00，已確認當日日 K 已發布），且與 21:00 籌碼採集
      # 有近 5 小時緩衝。這個池只維護日 K，不進盤中掃描、籌碼同步、signal 或 SR 分析。
      EVALUATION_UNIVERSE_ENABLED: ${EVALUATION_UNIVERSE_ENABLED:-false}
      EVALUATION_UNIVERSE_CRON: ${EVALUATION_UNIVERSE_CRON:-0 16 * * 1-5}
      EVALUATION_UNIVERSE_DAYS: ${EVALUATION_UNIVERSE_DAYS:-10}
      # 公司行動同步（分割／除權息／減資 → 還原係數）。**沒有 enabled 開關**：
      # 漏跑一次就會讓該檔整段歷史出現假跳空，而重算是冪等的，所以沒有關掉它的情境。
      # 06:30 早於 08:50 的 pre_market，讓開盤前的分析已吃到最新係數。
      # 打錯字會退回預設值繼續跑並記 Error log（靜默停掉等於還原係數無聲過期）。
      # **不要設得比 80 小時稀疏**：/scheduler/status 的 stale 門檻寫死 80 小時，
      # 稀疏排程會永遠顯示逾期（見 docs/api-reference.md）。
      CORPORATE_ACTION_CRON: ${CORPORATE_ACTION_CRON:-30 6 * * 1-5}
      # 留白（預設）時 main.go 會把 gin 設成 release。**正式環境不要設 debug**：
      # 它會把完整路由表寫進 log，且 panic 時 recovery 會連整包 request header 一起印
      # （gin 只遮 Authorization，Cookie 與自訂 header 照樣落地）。
      # 這裡留這個鍵只是讓排查問題時不必改 compose，deploy.sh 刻意不 export 它。
      GIN_MODE: ${GIN_MODE:-}
      LOG_DIR: /app/logs/backend
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    volumes:
      - ./logs/backend:/app/logs/backend
    networks:
      - trading-net
      - proxy_net

  # ── Python Worker（Method A：DB polling）─────────────────────
  python-worker:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: "postgresql+psycopg2://trading:trading@postgres:5432/trading"
      SR_SCORING_MODEL_PATH: /app/models/sr_scoring_v4.joblib
      LOG_DIR: /app/logs/python-worker
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    volumes:
      - ${SR_SCORING_MODELS_DIR:-./python/models}:/app/models
      - ./logs/python-worker:/app/logs/python-worker
    networks:
      - trading-net

  # ── Python HTTP Server（Method B：FastAPI）────────────────────
  # 僅供 backend 透過 trading-net 內部呼叫（PYTHON_SERVICE_URL），不對外開 port
  python-server:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "http_server.py"]
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_DSN: "postgresql+psycopg2://trading:trading@postgres:5432/trading"
      PYTHON_SERVICE_PORT: "8001"
      SR_SCORING_MODEL_PATH: /app/models/sr_scoring_v4.joblib
      LOG_DIR: /app/logs/python-server
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
    volumes:
      - ${SR_SCORING_MODELS_DIR:-./python/models}:/app/models
      - ./logs/python-server:/app/logs/python-server
    networks:
      - trading-net

networks:
  trading-net:
    external: true
  proxy_net:
    external: true
